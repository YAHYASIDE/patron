apiVersion: apps/v1
kind: Deployment
metadata:
  name: patron-worker
  namespace: patron
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: patron-worker }
  template:
    metadata:
      labels: { app: patron-worker }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: ghcr.io/ORG/patron:TAG
          command: ["node", "dist/worker"]
          envFrom:
            - configMapRef: { name: patron-config }
            - secretRef: { name: patron-secrets }
          env:
            - name: OTEL_SERVICE_NAME
              value: patron-worker
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits:   { cpu: 1000m, memory: 1Gi }
          # No HTTP server, so liveness is a process check only.
          livenessProbe:
            exec: { command: ["node", "-e", "process.exit(0)"] }
            initialDelaySeconds: 30
            periodSeconds: 30
      # A worker mid-provider-call has already spent money. It must be allowed
      # to finish rather than be killed with the purchase unrecorded.
      terminationGracePeriodSeconds: 90
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: patron-worker
  namespace: patron
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: patron-worker }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    # Scale on queue depth, not CPU. A worker blocked on a slow provider call
    # uses no CPU while the backlog grows — CPU-based scaling would never fire.
    - type: External
      external:
        metric:
          name: patron_queue_depth
          selector:
            matchLabels: { queue: fulfilment, state: waiting }
        target: { type: AverageValue, averageValue: "30" }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
      policies: [{ type: Pods, value: 1, periodSeconds: 120 }]
