# Migrations run as a Job before the new version rolls out.
#
# Deliberately a separate Job rather than an initContainer: an initContainer
# runs once per pod, so three replicas racing `migrate deploy` is three
# concurrent advisory-lock waits on every deploy.
apiVersion: batch/v1
kind: Job
metadata:
  name: patron-migrate
  namespace: patron
  annotations:
    # Helm hook — with plain kubectl, apply this and wait for completion first.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/ORG/patron:TAG
          command: ["npx", "prisma", "migrate", "deploy"]
          envFrom:
            - configMapRef: { name: patron-config }
            - secretRef: { name: patron-secrets }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
