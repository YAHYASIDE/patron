apiVersion: v1
kind: Namespace
metadata:
  name: patron
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: patron-config
  namespace: patron
data:
  NODE_ENV: "production"
  PORT: "3000"
  API_PREFIX: "api/v1"
  BASE_CURRENCY: "USD"
  LOG_LEVEL: "info"
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability:4318"
  OTEL_SAMPLE_RATIO: "0.1"
---
# Secrets are referenced, never committed. Populate from your secret manager
# (External Secrets Operator, Vault, SOPS) — a plain Secret manifest in git is
# base64, which is not encryption.
apiVersion: v1
kind: Secret
metadata:
  name: patron-secrets
  namespace: patron
type: Opaque
stringData:
  DATABASE_URL: "REPLACE_VIA_SECRET_MANAGER"
  REDIS_PASSWORD: "REPLACE_VIA_SECRET_MANAGER"
  ENCRYPTION_KEY: "REPLACE_VIA_SECRET_MANAGER"
  JWT_ACCESS_SECRET: "REPLACE_VIA_SECRET_MANAGER"
  JWT_REFRESH_SECRET: "REPLACE_VIA_SECRET_MANAGER"
  METRICS_TOKEN: "REPLACE_VIA_SECRET_MANAGER"
