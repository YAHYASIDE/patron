# ─────────────────────────────────────────────────────────────────────────────
# Patron — Render Blueprint (Infrastructure as Code)
#
# One file that provisions the whole stack in Render: a PostgreSQL database, a
# Key Value (Redis) store for the job queue, the NestJS API, and the Next.js
# admin dashboard. Render reads this file when you create a Blueprint from the
# repo, then creates and wires everything automatically.
#
# Setup is ~5 taps — see docs/DEPLOY_RENDER.md. You never paste a secret except:
#   • ENCRYPTION_KEY     — a 64-hex value you generate on your own device
#   • SEED_ADMIN_PASSWORD — the admin login password you choose
# All other secrets (JWT signing keys, metrics token) are generated by Render.
#
# Free tier notes: Render's `free` plan covers web services and Key Value, but
# NOT background workers (so the fulfilment worker is left commented out below —
# enable it on a paid plan when you go live). Free web services sleep after
# ~15 min idle and cold-start on the next request; free PostgreSQL is capped and
# expires after ~30 days. Fine to get a live link; upgrade before real traffic.
# ─────────────────────────────────────────────────────────────────────────────

databases:
  - name: patron-db
    plan: free
    databaseName: patron
    user: patron
    region: frankfurt
    ipAllowList: []            # internal-only — no public access

services:
  # ─────────────── Key Value (Redis) — BullMQ job queue ───────────────
  - type: keyvalue
    name: patron-kv
    plan: free
    region: frankfurt
    ipAllowList: []            # internal-only
    maxmemoryPolicy: noeviction   # BullMQ requires noeviction so jobs are never dropped

  # ─────────────── API (NestJS) ───────────────
  - type: web
    name: etssadagha-api
    runtime: docker
    plan: free
    region: frankfurt
    # Dockerfile + context are the app directory (CLAUDE.md rule 9: app-scoped,
    # self-contained build context), both relative to the repo root.
    dockerfilePath: apps/api/Dockerfile
    dockerContext: apps/api
    branch: claude/patron-monorepo-setup-1o2gl7
    healthCheckPath: /api/v1/health/live
    buildFilter:
      paths:
        - apps/api/**           # only rebuild when the API changes
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"           # the API and its Docker healthcheck both use 3000
      - key: DATABASE_URL
        fromDatabase:
          name: patron-db
          property: connectionString
      # Internal Key Value has no password (ipAllowList: []), so host+port is all
      # the API needs; it reads REDIS_HOST / REDIS_PORT (configuration.ts).
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: patron-kv
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: patron-kv
          property: port
      - key: JWT_ACCESS_SECRET
        generateValue: true     # Render generates a strong random secret
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: METRICS_TOKEN
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false             # you paste a 64-hex value (generator link in the runbook)
      - key: SEED_ADMIN_PASSWORD
        sync: false             # the admin login password you choose
      - key: SEED_ON_BOOT
        value: "true"           # first deploy seeds the DB; set to "false" afterwards
      - key: BASE_CURRENCY
        value: USD
      - key: CORS_ORIGINS
        value: https://etssadagha-shop.onrender.com
      - key: OTEL_ENABLED
        value: "false"

  # ─────────────── Admin dashboard (Next.js) ───────────────
  - type: web
    name: etssadagha-shop
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: apps/admin/Dockerfile
    dockerContext: apps/admin
    branch: claude/patron-monorepo-setup-1o2gl7
    healthCheckPath: /login
    buildFilter:
      paths:
        - apps/admin/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: HOSTNAME
        value: 0.0.0.0           # Next.js standalone must bind all interfaces
      # Render passes service env vars as Docker build args; the admin Dockerfile
      # declares ARG NEXT_PUBLIC_API_URL, and Next.js inlines it at build time.
      # This points at the API service's public URL above.
      - key: NEXT_PUBLIC_API_URL
        value: https://etssadagha-api.onrender.com/api/v1

  # ─────────────── Fulfilment worker (enable on a paid plan) ───────────────
  # Background workers are not available on the free plan. When you upgrade,
  # uncomment this and set `plan` to a paid instance type. It reuses the same
  # image and the same DB/Key Value; no public URL or healthcheck needed.
  #
  # - type: worker
  #   name: etssadagha-worker
  #   runtime: docker
  #   plan: starter
  #   region: frankfurt
  #   dockerfilePath: apps/api/Dockerfile
  #   dockerContext: apps/api
  #   branch: claude/patron-monorepo-setup-1o2gl7
  #   dockerCommand: node dist/worker       # run the worker, not the API entrypoint
  #   buildFilter:
  #     paths:
  #       - apps/api/**
  #   envVars:
  #     - key: NODE_ENV
  #       value: production
  #     - key: DATABASE_URL
  #       fromDatabase:
  #         name: patron-db
  #         property: connectionString
  #     - key: REDIS_HOST
  #       fromService:
  #         type: keyvalue
  #         name: patron-kv
  #         property: host
  #     - key: REDIS_PORT
  #       fromService:
  #         type: keyvalue
  #         name: patron-kv
  #         property: port
  #     - key: ENCRYPTION_KEY
  #       sync: false
