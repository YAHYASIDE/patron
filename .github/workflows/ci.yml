name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ═══════════════ API (apps/api) ═══════════════
  api-lint:
    name: API · lint & types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint:check
      - name: Type check
        run: npx tsc --noEmit
      - name: Prisma schema is formatted
        run: npx prisma format --check

  api-drift:
    name: API · migration drift
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: shadow }
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Catches a hand-edited migration drifting from schema.prisma, which
      # otherwise only surfaces on the production deploy.
      #
      # schema.prisma is the logical model; the migrations additionally apply an
      # operational layer Prisma's datamodel cannot express — BRIN / GIN-trigram /
      # partial / keyset indexes, DB-side id defaults and FK ON UPDATE actions. A
      # plain `migrate diff --exit-code` can never be clean while those exist, so
      # instead we assert the diff carries no *structural* drift: no table or
      # column added, dropped, retyped or renamed. That still fails a hand-edited
      # migration that diverges from the schema in a way that would break the
      # Prisma Client, while tolerating the intended operational layer.
      - name: Migrations match the schema (no structural drift)
        run: |
          # set -e aborts the step if `migrate diff` itself errors (a broken
          # migration, unreachable shadow DB), so an empty file can never be
          # mistaken for "no drift".
          set -euo pipefail
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://postgres:postgres@localhost:5432/shadow \
            --script > migration-drift.sql
          echo '----- migrations → schema.prisma datamodel diff -----'
          cat migration-drift.sql
          DANGER='CREATE TABLE|DROP TABLE|ADD COLUMN|DROP COLUMN|SET DATA TYPE|SET NOT NULL|DROP NOT NULL|RENAME COLUMN|ALTER TABLE "[^"]*" RENAME'
          if grep -Eq "$DANGER" migration-drift.sql; then
            echo '::error::Structural drift between the migrations and schema.prisma'
            grep -nE "$DANGER" migration-drift.sql
            exit 1
          fi
          echo 'OK — only the intended operational layer (indexes, id/FK defaults) differs.'

  api-unit:
    name: API · unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:unit -- --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: coverage, path: apps/api/coverage/ }

  api-integration:
    name: API · integration & e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: patron
          POSTGRES_PASSWORD: patron
          POSTGRES_DB: patron_test
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ['5432:5432']
      redis:
        image: redis:7-alpine
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://patron:patron@localhost:5432/patron_test?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run test:integration
      - run: npm run test:e2e

  # ═══════════════ Admin (apps/admin) ═══════════════
  admin:
    name: Admin · lint, types & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint:check
      - run: npm run typecheck
      - run: npm run build

  # ═══════════════ Mobile (apps/mobile) ═══════════════
  mobile:
    name: Mobile · analyze & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # ═══════════════ Security (whole repo) ═══════════════
  security:
    name: Security checks
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Dependency audit (api)
        # Moderate and above fails. Anything lower is triaged weekly, not
        # allowed to block every PR.
        working-directory: apps/api
        run: npm ci && npm audit --audit-level=moderate

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Static analysis
        uses: github/codeql-action/init@v3
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@v3

      - name: Verify no secrets in the image build context
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.pem$|\.key$'; then
            echo "::error::Secret-shaped file is tracked in git"; exit 1
          fi

  # ═══════════════ Image (apps/api) ═══════════════
  build:
    name: Build API image
    runs-on: ubuntu-latest
    needs: [api-lint, api-unit, api-drift]
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image ref
        id: img
        # ghcr requires a lowercase repository; github.repository keeps the
        # owner's original case (e.g. YAHYASIDE), which is an invalid image
        # reference and made Trivy fail to parse the name.
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # Build into the local Docker daemon so the scan has a real image to read
      # — the buildx cache alone is invisible to Trivy, and on a pull request the
      # image is never pushed. A push to main additionally publishes below,
      # reusing this cache so it is near-instant.
      - uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          load: true
          tags: ${{ steps.img.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false          # `load` cannot export a provenance multi-manifest

      - name: Scan image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.img.outputs.ref }}
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true       # do not block on things with no patch

      - name: Publish image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          push: true
          tags: ${{ steps.img.outputs.ref }}
          cache-from: type=gha
          provenance: true           # supply-chain attestation
