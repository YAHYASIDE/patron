name: Deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        required: true

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false      # never cancel a deploy mid-migration

jobs:
  staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.patron.io
    steps:
      - uses: actions/checkout@v4

      - name: Migrate
        run: |
          kubectl -n patron-staging delete job patron-migrate --ignore-not-found
          kubectl -n patron-staging apply -f deploy/k8s/10-migration-job.yaml
          kubectl -n patron-staging wait --for=condition=complete job/patron-migrate --timeout=300s

      - name: Roll out
        run: |
          kubectl -n patron-staging set image deployment/patron-api \
            api=ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          kubectl -n patron-staging set image deployment/patron-worker \
            worker=ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          kubectl -n patron-staging rollout status deployment/patron-api --timeout=300s
          kubectl -n patron-staging rollout status deployment/patron-worker --timeout=300s

      - name: Smoke test
        run: |
          curl -fsS https://staging.patron.io/api/v1/health/ready
          curl -fsS https://staging.patron.io/api/v1/catalog/currencies

      - name: Load test
        run: k6 run --env BASE_URL=https://staging.patron.io/api/v1 test/load/checkout.load.js

  production:
    name: Deploy to production
    needs: [staging]
    runs-on: ubuntu-latest
    # Requires a manual approval configured on the environment. A deploy that
    # moves money should have a human on the hook for it.
    environment:
      name: production
      url: https://api.patron.io
    steps:
      - uses: actions/checkout@v4

      - name: Back up before migrating
        # Non-negotiable ordering. A migration with no restore point is a
        # decision to accept data loss.
        run: ./deploy/scripts/backup.sh pre-deploy-${{ github.ref_name }}

      - name: Migrate
        run: |
          kubectl -n patron delete job patron-migrate --ignore-not-found
          kubectl -n patron apply -f deploy/k8s/10-migration-job.yaml
          kubectl -n patron wait --for=condition=complete job/patron-migrate --timeout=600s

      - name: Roll out
        run: |
          kubectl -n patron set image deployment/patron-api \
            api=ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          kubectl -n patron set image deployment/patron-worker \
            worker=ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          kubectl -n patron rollout status deployment/patron-api --timeout=600s
          kubectl -n patron rollout status deployment/patron-worker --timeout=600s

      - name: Verify
        run: |
          curl -fsS https://api.patron.io/api/v1/health/ready
          # Fail the deploy if the outbox is backing up — that means committed
          # orders are not reaching workers on the new version.
          PENDING=$(curl -fsS -H "authorization: Bearer ${{ secrets.METRICS_TOKEN }}" \
            https://api.patron.io/api/v1/metrics | grep '^patron_outbox_pending' | awk '{print $2}')
          if [ "${PENDING%.*}" -gt 100 ]; then
            echo "::error::Outbox backlog after deploy: $PENDING"; exit 1
          fi

      - name: Roll back on failure
        if: failure()
        run: |
          kubectl -n patron rollout undo deployment/patron-api
          kubectl -n patron rollout undo deployment/patron-worker
          echo "::error::Rolled back. NOTE: migrations are not reverted — see docs/DISASTER_RECOVERY.md"
