name: Nightly

on:
  schedule: [{ cron: '0 2 * * *' }]
  workflow_dispatch:

jobs:
  resilience:
    name: Resilience & stress
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: patron, POSTGRES_PASSWORD: patron, POSTGRES_DB: patron_test }
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
        ports: ['5432:5432']
    env:
      DATABASE_URL: postgresql://patron:patron@localhost:5432/patron_test?schema=public
      ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci && npx prisma generate && npx prisma migrate deploy
      # Long-running concurrency and chaos suites — too slow for every PR,
      # too important to never run.
      - run: npm run test:resilience

  audit:
    name: Dependency drift
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=low || true
      - run: npx npm-check-updates --format group
