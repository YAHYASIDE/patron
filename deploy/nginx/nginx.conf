user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;

events { worker_connections 4096; }

http {
  include /etc/nginx/mime.types;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;                      # do not advertise the version

  # Correlation id is generated here if the client did not send one, so even a
  # request rejected at the edge is traceable.
  map $http_x_correlation_id $correlation_id {
    default   $http_x_correlation_id;
    ""        $request_id;
  }

  log_format json escape=json '{'
    '"time":"$time_iso8601",'
    '"correlation_id":"$correlation_id",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$uri",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"duration":$request_time,'
    '"upstream_time":"$upstream_response_time"'
  '}';
  access_log /var/log/nginx/access.log json;

  # Edge rate limiting. The app has its own throttler; this stops abusive
  # traffic before it costs a Node process anything.
  limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m    rate=5r/m;
  limit_conn_zone $binary_remote_addr zone=conns:10m;

  upstream patron_api {
    least_conn;
    server api:3000 max_fails=3 fail_timeout=15s;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;
    # ACME challenges must stay on HTTP.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 2m;
    limit_conn conns 50;

    gzip on;
    gzip_types application/json text/plain text/csv;
    gzip_min_length 1024;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $correlation_id;

    location / {
      limit_req zone=general burst=60 nodelay;
      proxy_pass http://patron_api;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
    }

    # Brute-force surface: far stricter, and no burst.
    location ~ ^/api/v1/auth/(login|register|forgot-password|reset-password) {
      limit_req zone=auth burst=3 nodelay;
      proxy_pass http://patron_api;
    }

    # Webhooks must reach the app with the body byte-identical, or signature
    # verification fails. No buffering, no rewriting.
    location /api/v1/webhooks/ {
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_pass http://patron_api;
      proxy_read_timeout 20s;
    }

    # Never expose metrics to the internet.
    location /api/v1/metrics {
      allow 10.0.0.0/8;
      allow 172.16.0.0/12;
      deny all;
      proxy_pass http://patron_api;
    }

    location /api/v1/health {
      access_log off;
      proxy_pass http://patron_api;
    }
  }
}
