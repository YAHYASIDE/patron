apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: patron
  namespace: patron
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
    nginx.ingress.kubernetes.io/limit-rps: "30"
    # Webhook signature verification needs the raw body untouched.
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [api.patron.io]
      secretName: patron-tls
  rules:
    - host: api.patron.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: patron-api, port: { number: 80 } }
---
# Default deny. Everything a pod is allowed to reach is then explicit — the
# blast radius of a compromised container is what this controls.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: patron
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: patron-api-allow
  namespace: patron
spec:
  podSelector:
    matchLabels: { app: patron-api }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { name: ingress-nginx } }
        - namespaceSelector: { matchLabels: { name: monitoring } }
      ports: [{ protocol: TCP, port: 3000 }]
  egress:
    - to: [{ podSelector: { matchLabels: { app: postgres } } }]
      ports: [{ protocol: TCP, port: 5432 }]
    - to: [{ podSelector: { matchLabels: { app: redis } } }]
      ports: [{ protocol: TCP, port: 6379 }]
    - to: [{ namespaceSelector: { matchLabels: { name: observability } } }]
    # DNS, then outbound HTTPS for payment gateways and providers.
    - ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    - ports: [{ protocol: TCP, port: 443 }]
